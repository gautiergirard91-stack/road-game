name: CI

on:
  push:
    branches: [main, 'vibe/**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tests de la logique de jeu
        run: node tests/core.test.mjs
      - name: Smoke test du moteur (headless)
        run: node tests/game.smoke.test.mjs
