# La clé API web Firebase dans js/config.js est PUBLIQUE BY DESIGN :
# elle identifie juste le projet Firebase côté client et n'accorde AUCUN accès
# (l'autorisation passe par les règles RTDB + App Check, voir docs/SECURITY.md).
# On exclut donc ce fichier du secret scanning pour fermer automatiquement les
# alertes "Google API Key" (faux positif connu des clés web Firebase).
paths-ignore:
  - "js/config.js"
